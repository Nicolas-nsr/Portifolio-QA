
name: CI - Testes automatizados

on:
  push:
    branches:
      - develop
      - qa
      - main

  pull_request:
    branches:
      - develop
      - qa
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Testes Mocha
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test
